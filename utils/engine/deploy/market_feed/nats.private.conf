# Opt-in replacement for nats.conf. Restore public JetStream into GG_PUBLIC before resuming clients.
server_name: golden-goose-private-shadow
port: 4222
http_port: 8222
max_payload: 1048576
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 64MB
  max_file_store: 896MB
}

no_auth_user: gg_public
accounts {
  GG_PUBLIC {
    jetstream: enabled
    users: [{user: gg_public, password: $GG_PUBLIC_NATS_FALLBACK_PASSWORD, permissions: {
      publish: { deny: "private.>" },
      subscribe: { deny: "private.>" }
    }}]
  }
  GG_BURST {
    jetstream: enabled
    users: [
      {user: burst_manager, password: $GG_PRIVATE_BURST_MANAGER, permissions: {
         publish: ["private.burst.event", "$SYS.REQ.USER.INFO"],
         subscribe: "_INBOX.>"
      }},
      {user: burst_consumer, password: $GG_PRIVATE_BURST_CONSUMER, permissions: {
         publish: ["$SYS.REQ.USER.INFO", "$JS.API.STREAM.INFO.GG_PRIVATE_V1",
                   "$JS.API.CONSUMER.INFO.GG_PRIVATE_V1.gg_shadow_v1",
                   "$JS.API.CONSUMER.MSG.NEXT.GG_PRIVATE_V1.gg_shadow_v1",
                   "$JS.ACK.>"],
         subscribe: "_INBOX.>"
      }},
      {user: burst_init, password: $GG_PRIVATE_BURST_INIT}
    ]
  }
  GG_QUIET_CORE {
    jetstream: enabled
    users: [
      {user: quiet_core_manager, password: $GG_PRIVATE_QUIET_CORE_MANAGER, permissions: {
         publish: ["private.quiet_core.event", "$SYS.REQ.USER.INFO"],
         subscribe: "_INBOX.>"
      }},
      {user: quiet_core_consumer, password: $GG_PRIVATE_QUIET_CORE_CONSUMER, permissions: {
         publish: ["$SYS.REQ.USER.INFO", "$JS.API.STREAM.INFO.GG_PRIVATE_V1",
                   "$JS.API.CONSUMER.INFO.GG_PRIVATE_V1.gg_shadow_v1",
                   "$JS.API.CONSUMER.MSG.NEXT.GG_PRIVATE_V1.gg_shadow_v1",
                   "$JS.ACK.>"],
         subscribe: "_INBOX.>"
      }},
      {user: quiet_core_init, password: $GG_PRIVATE_QUIET_CORE_INIT}
    ]
  }
  GG_QUIET_TAIL {
    jetstream: enabled
    users: [
      {user: quiet_tail_manager, password: $GG_PRIVATE_QUIET_TAIL_MANAGER, permissions: {
         publish: ["private.quiet_tail.event", "$SYS.REQ.USER.INFO"],
         subscribe: "_INBOX.>"
      }},
      {user: quiet_tail_consumer, password: $GG_PRIVATE_QUIET_TAIL_CONSUMER, permissions: {
         publish: ["$SYS.REQ.USER.INFO", "$JS.API.STREAM.INFO.GG_PRIVATE_V1",
                   "$JS.API.CONSUMER.INFO.GG_PRIVATE_V1.gg_shadow_v1",
                   "$JS.API.CONSUMER.MSG.NEXT.GG_PRIVATE_V1.gg_shadow_v1",
                   "$JS.ACK.>"],
         subscribe: "_INBOX.>"
      }},
      {user: quiet_tail_init, password: $GG_PRIVATE_QUIET_TAIL_INIT}
    ]
  }
}
