name: golden-goose-burst-shadow

x-worker: &worker
  image: ${BURST_SHADOW_IMAGE:?set the verified Burst image}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=16m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  cpus: 0.25
  networks: [market]
  healthcheck:
    test: ["CMD", "python", "-m", "utils.engine.monitoring.service_health", "--database", "/data/shadow.sqlite", "--keys", "worker_heartbeat_ms"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 90s
  logging:
    driver: local
    options: {max-size: "5m", max-file: "2"}

services:
  hype-shadow:
    <<: *worker
    command: ["--database", "/data/shadow.sqlite", "--allocation-usdt", "1000", "--shadow-symbol", "HYPEUSDT", "--market-nats-url", "nats://nats:4222"]
    volumes: [hype_shadow:/data]
  inj-shadow:
    <<: *worker
    command: ["--database", "/data/shadow.sqlite", "--allocation-usdt", "1000", "--shadow-symbol", "INJUSDT", "--market-nats-url", "nats://nats:4222"]
    volumes: [inj_shadow:/data]
  uni-shadow:
    <<: *worker
    command: ["--database", "/data/shadow.sqlite", "--allocation-usdt", "1000", "--shadow-symbol", "UNIUSDC", "--market-nats-url", "nats://nats:4222"]
    volumes: [uni_shadow:/data]

volumes:
  hype_shadow:
  inj_shadow:
  uni_shadow:

networks:
  market:
    external: true
    name: golden-goose-live-market_broker
