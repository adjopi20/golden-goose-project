name: golden-goose-hype-burst

x-worker: &worker
  image: ${HYPE_BURST_IMAGE:?set the verified Git image tag}
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options: {max-size: "20m", max-file: "5"}

x-trading: &trading
  networks: [default, market]
  env_file:
    - ${HYPE_BURST_ARMING_ENV:?set the external arming env file}

x-health: &health
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 90s

x-burst: &burst
  profiles: [burst]
  volumes:
    - ${HYPE_BURST_STATE:?set the persistent external state directory}:/data
    - type: bind
      source: ${HYPE_BURST_SECRETS:?set the existing Burst secrets directory}
      target: /run/account-secrets
      read_only: true
      bind: {create_host_path: false}

x-quiet-core: &quiet-core
  profiles: [quiet-core]
  volumes:
    - ${HYPE_BURST_STATE:?set the persistent external state directory}:/data
    - type: bind
      source: ${QUIET_CORE_SECRETS:-./unconfigured-quiet-core}
      target: /run/account-secrets
      read_only: true
      bind: {create_host_path: false}

x-quiet-tail: &quiet-tail
  profiles: [quiet-tail]
  volumes:
    - ${HYPE_BURST_STATE:?set the persistent external state directory}:/data
    - type: bind
      source: ${QUIET_TAIL_SECRETS:-./unconfigured-quiet-tail}
      target: /run/account-secrets
      read_only: true
      bind: {create_host_path: false}

services:
  hype-burst-live:
    <<: [*worker, *trading, *burst]
    command:
      - --portfolio-model
      - burst_hypeusdt_16h_f_p1_initiative_add
      - --database
      - /data/burst_hypeusdt_16h_f_p1_initiative_add.sqlite
      - --api-key-file
      - /run/account-secrets/api-key
      - --private-key-file
      - /run/account-secrets/ed25519.pem
      - --passphrase-file
      - /run/account-secrets/passphrase
      - --market-nats-url
      - nats://nats:4222
      - --armed
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-m", "utils.engine.monitoring.service_health", "--database", "/data/burst_hypeusdt_16h_f_p1_initiative_add.sqlite", "--keys", "worker_heartbeat_ms"]

  inj-burst-live:
