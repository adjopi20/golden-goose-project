name: mr-ltcusdc-paper
services:
  ltc-paper:
    build:
      context: ../../..
      dockerfile: models/mean_reversion_by_volume_profile/paper_v33/Dockerfile
    image: golden-goose/mr-ltcusdc-paper:v33
    restart: "on-failure:3"
    stop_grace_period: 90s
    volumes:
      - paper-state:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "models.mean_reversion_by_volume_profile.paper_v33.worker", "--database", "/data/ltcusdc.sqlite", "--action", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  paper-state:
