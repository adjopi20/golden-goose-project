# Overlay AFTER infra/deploy/phase2/compose.yaml. Start only named Phase 4 services.
# Existing legacy/Phase 3 services remain authoritative; this is NOT a cutover.
x-account: &account
  build:
    context: ../../..
    dockerfile: live_engine/Dockerfile.account
    args: {CODE_VERSION: "${GG_PHASE4_COMMIT:?Set the exact tested git commit}"}
  image: golden-goose/paper-account:${GG_PHASE4_COMMIT}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp:size=16m]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 96m
  cpus: 0.25
  networks: [broker]
  depends_on:
    nats: {condition: service_healthy}
  logging:
    driver: local
    options: {max-size: "5m", max-file: "2"}
  healthcheck:
    test: ["CMD", "python", "-m", "live_engine.service_health", "--database", "/data/account.sqlite", "--keys", "last_timer_ms", "last_poll:GG_INTENT_V1", "last_poll:GG_MARKET_V1", "last_poll:GG_EXEC_V1"]
    interval: 60s
    timeout: 10s
    start_period: 3m
    retries: 3

x-strategy: &strategy
  build:
    context: ../../..
    dockerfile: models/trend_following_preny_profile_15m/deploy/Dockerfile.shadow
    args: {CODE_VERSION: "${GG_PHASE4_COMMIT:?Set the exact tested git commit}"}
  image: golden-goose/preny-strategy-phase4:${GG_PHASE4_COMMIT}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp:size=32m]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 256m
  cpus: 0.25
  networks: [broker]
  logging:
    driver: local
    options: {max-size: "5m", max-file: "2"}
  healthcheck:
    test: ["CMD", "python", "-m", "live_engine.service_health", "--database", "/data/strategy.sqlite", "--keys", "last_poll_ms"]
    interval: 60s
    timeout: 10s
    start_period: 10m
    retries: 3

services:
  account-stream-init:
    <<: *account
    restart: "no"
    command: ["--init-stream"]
    healthcheck: {disable: true}
  binance-account-shadow:
    <<: *account
    command: ["--config", "/app/config/binance.account.json", "--database", "/data/account.sqlite", "--code-version", "${GG_PHASE4_COMMIT}"]
    volumes: [binance_account_phase4:/data]
  lighter-account-shadow:
    <<: *account
    command: ["--config", "/app/config/lighter.account.json", "--database", "/data/account.sqlite", "--code-version", "${GG_PHASE4_COMMIT}"]
    volumes: [lighter_account_phase4:/data]
  binance-strategy-paper-shadow:
    <<: *strategy
    depends_on:
      binance-account-shadow: {condition: service_healthy}
    command: ["--database", "/data/strategy.sqlite", "--bootstrap-database", "/bootstrap/binance.sqlite", "--config", "/app/config/binance.paper.yaml", "--c1-calibration", "/app/config/hype.binance.c1_2026-10.json", "--code-version", "${GG_PHASE4_COMMIT}", "--durable-prefix", "phase4", "--publish-intentions"]
    volumes: [binance_strategy_phase4:/data, binance_data:/bootstrap:ro]
  lighter-strategy-paper-shadow:
    <<: *strategy
    depends_on:
      lighter-account-shadow: {condition: service_healthy}
    command: ["--database", "/data/strategy.sqlite", "--bootstrap-database", "/bootstrap/lighter.sqlite", "--config", "/app/config/lighter.paper.yaml", "--code-version", "${GG_PHASE4_COMMIT}", "--durable-prefix", "phase4", "--publish-intentions"]
    volumes: [lighter_strategy_phase4:/data, lighter_data:/bootstrap:ro]

volumes:
  binance_account_phase4:
  lighter_account_phase4:
  binance_strategy_phase4:
  lighter_strategy_phase4:
