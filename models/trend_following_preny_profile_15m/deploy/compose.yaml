services:
  binance-paper:
    build:
      context: ../../..
      dockerfile: live_engine/Dockerfile
    image: golden-goose/preny15m-binance-paper:local
    command: ["--database", "/data/binance.sqlite", "--action", "run"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - binance_paper_data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "live_engine.healthcheck", "--database", "/data/binance.sqlite", "--symbols", "ETHUSDC", "BNBUSDC", "HYPEUSDT", "--max-age-seconds", "180"]
      interval: 60s
      timeout: 10s
      start_period: 5m
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  binance_paper_data:
