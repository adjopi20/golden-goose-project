name: btc-mvrv-production
services:
  btc-mvrv-production:
    build:
      context: .
    image: golden-goose/btc-mvrv-dual:production-20261016
    entrypoint: ["python", "-m", "live_mvrv.binance_main"]
    command: ["run"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE: /data/binance-production.sqlite
      BINANCE_ENV: production
      BINANCE_KEY_TYPE: ed25519
      BINANCE_API_KEY: ${BINANCE_API_KEY:?Set a separate production API key}
      BINANCE_PRIVATE_KEY_FILE: /run/secrets/binance_ed25519.pem
      BINANCE_PRODUCTION_EXECUTION_ENABLED: ${BINANCE_PRODUCTION_EXECUTION_ENABLED:-false}
      BINANCE_PRODUCTION_ACK: ${BINANCE_PRODUCTION_ACK:-}
      BINANCE_PRODUCTION_MAX_ORDER_USDT: ${BINANCE_PRODUCTION_MAX_ORDER_USDT:-0}
      INITIAL_CAPITAL: ${INITIAL_CAPITAL:?Set total assigned USDT capital before FIRST funding}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - production_data:/data
      - type: bind
        source: ${BINANCE_PRIVATE_KEY_HOST_PATH:?Set a production private PEM outside the repository}
        target: /run/secrets/binance_ed25519.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-m", "live_mvrv.main", "health"]
      interval: 1m
      timeout: 20s
      start_period: 15m
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  production_data:
