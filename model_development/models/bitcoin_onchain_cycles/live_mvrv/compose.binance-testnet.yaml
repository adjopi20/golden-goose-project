name: btc-mvrv-binance-testnet
services:
  btc-mvrv-testnet:
    build:
      context: .
    image: golden-goose/btc-mvrv-dual:binance-testnet-v1
    entrypoint: ["python", "-m", "live_mvrv.binance_main"]
    command: ["run"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE: /data/binance-testnet.sqlite
      BINANCE_ENV: testnet
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TESTNET_EXECUTION_ENABLED: ${BINANCE_TESTNET_EXECUTION_ENABLED:-false}
      INITIAL_CAPITAL: ${INITIAL_CAPITAL:-1000}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes: ["binance_testnet_data:/data"]
    healthcheck:
      test: ["CMD", "python", "-m", "live_mvrv.main", "health"]
      interval: 5m
      timeout: 20s
      start_period: 15m
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  binance_testnet_data:
