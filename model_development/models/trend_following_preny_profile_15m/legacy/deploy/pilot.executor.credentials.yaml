# Optional credential mount ONLY; this does not override the two OFF switches or acknowledgement.
# Do not use for the first disarmed rollout. Never print expanded Compose config.
services:
  eth-executor:
    environment:
      BINANCE_API_KEY: "${BINANCE_API_KEY:?Use the server-only env file}"
    volumes:
      - type: bind
        source: "${BINANCE_PRIVATE_KEY_HOST_PATH:?Set existing registered PEM path}"
        target: /run/secrets/key.pem
        read_only: true
        bind: {create_host_path: false}
